<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>内容查询面板</title>
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}
body{
  background:#ffffff;
  color:#111827;
  padding:10px;
  font-family:system-ui,sans-serif;
}
body.dark{
  background:#0f172a;
  color:#f1f5f9;
}
#tl-box{
  width:100%;
}
#tl-box .wrap{
  width:100%;
  padding:8px;
  border-radius:14px;
  background:#fff;
  border:1px solid #e2e8f0;
}
body.dark #tl-box .wrap{
  background:#111827;
  border-color:#273449;
}
/* 公告 */
#tl-box .notice{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:8px;
  background:#fffbeb;
  border:1px solid #fcd34d;
  font-size:14px;
  line-height:1.5;
}
body.dark #tl-box .notice{
  background:#292524;
  border-color:#92400e;
}
/* 顶部栏 */
#tl-box .top-bar{
  display:flex;
  gap:8px;
  align-items:flex-start;
  margin-bottom:8px;
}
#tl-box .notice-wrap{
  flex:1;
}
#tl-box .theme-btn{
  padding:8px 10px;
  border:none;
  border-radius:8px;
  background:#e2e8f0;
  color:#111827;
  font-size:13px;
  cursor:pointer;
}
body.dark #tl-box .theme-btn{
  background:#334155;
  color:#f1f5f9;
}
/* 输入行 */
#tl-box .bar{
  display:flex;
  gap:12px;
  margin-bottom:4px;
  width:100%;
}
#tl-box input{
  flex:1;
  min-width:0;
  padding:12px 14px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  background:#fff;
  font-size:15px;
  outline:none;
}
body.dark #tl-box input{
  background:#1e293b;
  border-color:#475569;
  color:#f1f5f9;
}
#tl-box input:focus{
  border-color:#0ea5e9;
}
#tl-box button.load{
  padding:12px 20px;
  border:none;
  border-radius:8px;
  background:#0ea5e9;
  color:#fff;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
}
#tl-box button.load:hover{
  background:#0284c7;
}
/* 列表 */
#tl-box .list{
  width:100%;
}
#tl-box .item{
  width:100%;
  padding:8px;
  margin-bottom:4px;
  border-radius:10px;
  background:#f8fafc;
  overflow:hidden;
}
body.dark #tl-box .item{
  background:#1e293b;
}
#tl-box .time{
  font-size:12px;
  color:#64748b;
  margin-bottom:8px;
}
body.dark #tl-box .time{
  color:#94a3b8;
}
#tl-box .content{
  font-size:14px;
  line-height:1.6;
  /* 核心：长文本、长链接自动换行，不会横向撑出去 */
  word-break: break-all;
  overflow-wrap: break-word;
}
#tl-box .content img{
  max-width:100%;
  height:auto;
  display:block;
  border-radius:6px;
  margin:8px 0;
}
#tl-box .content a{
  color:#0284c7;
}

#tl-box .notice a{
  color:#0284c7;
}

body.dark #tl-box .content a{
  color:#38bdf8;
}

#tl-box .empty{
  padding:30px;
  text-align:center;
  color:#94a3b8;
  font-size:14px;
}
</style>
</head>
<body>
<div id="tl-box">
  <div class="wrap">
    <div class="top-bar">
      <div class="notice-wrap">
        <div class="notice">
         <p><center><a href="https://kuhehe.top" target="_blank">酷小呵资源：kuhehe.top</a>
</p></center> </br>
         <p> 💡 获取密码说明：<a href="https://kuhehe.bearblog.dev/" target="_blank">点我获取密码</a>
</p>
        </div>
      </div>
      <button class="theme-btn" id="themeSwitch">🌙 深色</button>
    </div>

    <div class="bar">
      <input type="text" id="pwdInput" placeholder="输入密码">
      <button class="load" id="loadBtn">确定</button>
    </div>
    <div class="list" id="view">
      <div class="empty">🔒 输入密码点击“确定”加载</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const body = document.body;
const themeSwitch = document.getElementById('themeSwitch');
const inp = document.getElementById('pwdInput');
const btn = document.getElementById('loadBtn');
const view = document.getElementById('view');

let userTheme = localStorage.getItem('theme');

function isAutoDark(){
  const h = new Date().getHours();
  return h >= 19 || h < 6;
}

function setDarkMode(enable){
  if(enable){
    body.classList.add('dark');
    themeSwitch.textContent = '☀️ 浅色';
  }else{
    body.classList.remove('dark');
    themeSwitch.textContent = '🌙 深色';
  }
}

if(userTheme === 'dark'){
  setDarkMode(true);
}else if(userTheme === 'light'){
  setDarkMode(false);
}else{
  setDarkMode(isAutoDark());
}

themeSwitch.onclick = ()=>{
  const nowDark = body.classList.contains('dark');
  setDarkMode(!nowDark);
  localStorage.setItem('theme', !nowDark ? 'dark' : 'light');
};

function fmt(t){
  if(!t) return '';
  const d = new Date(Number(t)>10000000000 ? t : t*1000);
  if(isNaN(d.getTime())) return '';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function load(tag){
  view.innerHTML = '<div class="empty">⏳ 加载中...</div>';
  try{
    const res = await fetch(`https://talk.kuhehehe.work/?tag=${encodeURIComponent(tag)}&limit=5&showtag=false&usemd=true`);
    const list = await res.json();
    if(!list.length){
      view.innerHTML = '<div class="empty">📭 暂无内容</div>';
      return;
    }
    let html = '';
    list.forEach(i=>{
      html += `<div class="item"><div class="time">${fmt(i.createdTs||i.created_at)}</div><div class="content">${marked.parse(i.content)}</div></div>`
    })
    view.innerHTML = html;
  }catch(e){
    view.innerHTML = '<div class="empty">⚠️ 加载失败</div>';
  }
}

btn.onclick = ()=>{
  const v = inp.value.trim();
  if(!v) return view.innerHTML = '<div class="empty">请输入密码</div>';
  load(v);
}
inp.onkeydown = e=>{
  if(e.key === 'Enter'){
    btn.click();
  }
}
</script>
</body>
</html>
